name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/simple-webapp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
      - name: Security scan (Trivy) - stop if CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress $IMAGE:latest
      - name: Push image to Docker Hub
        run: docker push $IMAGE --all-tags

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ vars.EC2_HOST }}
        run: |
          echo "$KEY" > key.pem && chmod 600 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@$HOST "
            docker pull $IMAGE:latest &&
            (docker rm -f web || true) &&
            docker run -d --name web --restart always -p 80:8080 $IMAGE:latest"
      - name: Check the live site
        run: sleep 5 && curl -f http://${{ vars.EC2_HOST }}/health
